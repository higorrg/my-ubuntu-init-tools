---
- name: Disable WiFi powersave via NetworkManager
  ansible.builtin.copy:
    content: |
      [connection]
      wifi.powersave = 2
    dest: /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Restart NetworkManager

- name: Configure ath10k_core module options for QCA9377
  ansible.builtin.copy:
    content: |
      # Qualcomm Atheros QCA9377 [168c:0042]
      # skip_otp=Y: avoids OTP calibration failure that can degrade link quality
      # cryptmode=1: software crypto improves stability on this chipset
      options ath10k_core skip_otp=Y cryptmode=1
    dest: /etc/modprobe.d/ath10k.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Update initramfs

- name: Disable PCI runtime power management for QCA9377
  ansible.builtin.copy:
    content: |
      # Qualcomm Atheros QCA9377 [168c:0042] - prevent PCI runtime suspend
      ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x168c", ATTR{device}=="0x0042", ATTR{power/control}="on"
    dest: /etc/udev/rules.d/80-qca9377-power.rules
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload udev rules
